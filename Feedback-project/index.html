<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Hub | Share Your Thoughts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-aurora">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Notification Container -->
    <div id="notification" class="notification">
        <div class="notif-icon">🚀</div>
        <div id="notif-text">Success: Feedback Sent!</div>
    </div>

    <!-- Main Feedback Container -->
    <div class="container">
        <!-- Dashboard / Desktop Look -->
        <div class="form-info">
            <h1>Feedback <br>Hub.</h1>
            <p>Your insights help us grow. Share your experience and let's build something amazing together.</p>
        </div>

        <div class="form-content">
            <h2>Feedback.</h2>
            <form id="feedbackForm">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="What's on your mind?" required></textarea>
                </div>

                <button type="submit">Submit Feedback</button>
            </form>

            <p id="successMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
